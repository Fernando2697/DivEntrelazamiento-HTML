<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simulador de 2 Qubits</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Space+Grotesk:wght@300;400;500;600&display=swap');

    :root {
      --ink: #1a1f2b;
      --paper: #f7f3ee;
      --mist: #e9e2d8;
      --accent: #1f8a70;
      --accent-2: #f2b134;
      --accent-3: #7a4e2d;
      --shadow: rgba(26, 31, 43, 0.12);
      --glow: rgba(31, 138, 112, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Space Grotesk", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, rgba(31, 138, 112, 0.15), transparent 45%),
        radial-gradient(circle at 82% 12%, rgba(242, 177, 52, 0.2), transparent 40%),
        radial-gradient(circle at 30% 85%, rgba(26, 31, 43, 0.08), transparent 55%),
        linear-gradient(180deg, var(--paper) 0%, #efe7dc 100%);
      min-height: 100vh;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 6rem 6vw;
    }

    .placeholder {
      width: min(920px, 100%);
      background: rgba(255, 255, 255, 0.82);
      border-radius: 32px;
      padding: 3rem;
      border: 1px solid rgba(31, 138, 112, 0.18);
      box-shadow: 0 24px 55px var(--shadow);
      backdrop-filter: blur(12px);
    }

    .placeholder h1 {
      font-family: "Fraunces", serif;
      font-size: clamp(2.4rem, 3.6vw, 3.6rem);
      margin-bottom: 1rem;
    }

    .placeholder p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #2f3441;
    }

    .backlink {
      margin-top: 2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--accent-3);
      font-weight: 600;
    }

    .backlink::before {
      content: "←";
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="placeholder">
      <h1>Simulador de 2 Qubits</h1>
      <p>
        Esta pagina esta reservada para el simulador interactivo. Por ahora, dejamos lista la identidad visual y
        el entorno donde vivira el modulo de experimentacion.
      </p>
      <a class="backlink" href="index.html">Volver a la pagina principal</a>
    </section>
  </main>
</body>
</html>
