<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simulador de 2 Qubits</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Space+Grotesk:wght@300;400;500;600&display=swap');

    :root {
      --ink: #1a1f2b;
      --paper: #f7f3ee;
      --mist: #e9e2d8;
      --accent: #1f8a70;
      --accent-2: #f2b134;
      --accent-3: #7a4e2d;
      --shadow: rgba(26, 31, 43, 0.12);
      --glow: rgba(31, 138, 112, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Space Grotesk", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, rgba(31, 138, 112, 0.15), transparent 45%),
        radial-gradient(circle at 82% 12%, rgba(242, 177, 52, 0.2), transparent 40%),
        radial-gradient(circle at 30% 85%, rgba(26, 31, 43, 0.08), transparent 55%),
        linear-gradient(180deg, var(--paper) 0%, #efe7dc 100%);
      min-height: 100vh;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.5rem 6vw 0;
    }

    .topbar img {
      width: 56px;
      height: auto;
      display: block;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.12));
    }

    .topbar .team-name {
      font-family: "Fraunces", serif;
      font-size: 1.1rem;
      color: #1b1b1b;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 6rem 6vw;
    }

    .simulator {
      width: min(980px, 100%);
      background: rgba(255, 255, 255, 0.88);
      border-radius: 32px;
      padding: 3rem;
      border: 1px solid rgba(31, 138, 112, 0.18);
      box-shadow: 0 24px 55px var(--shadow);
      backdrop-filter: blur(12px);
      display: grid;
      gap: 2.2rem;
    }

    .simulator h1 {
      font-family: "Fraunces", serif;
      font-size: clamp(2.4rem, 3.6vw, 3.6rem);
      margin-bottom: 1rem;
    }

    .simulator p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #2f3441;
    }

    .circuit {
      display: grid;
      gap: 1.8rem;
      padding: 1.4rem 1.2rem 1.6rem;
      border-radius: 24px;
      background: linear-gradient(120deg, rgba(31, 138, 112, 0.08), rgba(242, 177, 52, 0.08));
      border: 1px solid rgba(26, 31, 43, 0.08);
    }

    .wire-row {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 1.2rem;
    }

    .ket-label {
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--accent-3);
      background: rgba(122, 78, 45, 0.08);
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      border: 1px solid rgba(122, 78, 45, 0.2);
      min-width: 64px;
      text-align: center;
    }

    .gate-track {
      position: relative;
      display: grid;
      grid-template-columns: repeat(10, minmax(28px, 1fr));
      gap: 0.5rem;
      padding: 0.5rem 0.2rem;
    }

    .gate-track::before {
      content: "";
      position: absolute;
      left: 0.2rem;
      right: 0.2rem;
      top: 50%;
      height: 2px;
      background: linear-gradient(90deg, rgba(26, 31, 43, 0.2), rgba(26, 31, 43, 0.4), rgba(26, 31, 43, 0.2));
      transform: translateY(-50%);
      z-index: 0;
    }

    .gate-slot {
      position: relative;
      z-index: 1;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid rgba(31, 138, 112, 0.45);
      background: rgba(255, 255, 255, 0.7);
      display: grid;
      place-items: center;
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .gate-slot[data-dropzone="true"]:hover {
      border-color: var(--accent);
      background: rgba(31, 138, 112, 0.12);
      transform: translateY(-2px);
    }

    .gate-slot.is-drag-over {
      border-color: var(--accent-2);
      background: rgba(242, 177, 52, 0.18);
    }

    .backlink {
      margin-top: 2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--accent-3);
      font-weight: 600;
    }

    .backlink::before {
      content: "←";
    }
  </style>
</head>
<body>
  <div class="topbar">
    <img src="Escudo-UNAM-escalable.svg" alt="Escudo UNAM" />
    <div class="team-name">Grupo de Computacion Cuantica en el CNyN</div>
  </div>
  <main class="shell">
    <section class="simulator">
      <div>
        <h1>Simulador de 2 Qubits</h1>
        <p>
          Iniciamos con el circuito base: dos lineas que parten del ket <strong>|0&gt;</strong>. Cada fila tiene
          espacios listos para colocar compuertas y visualizar el circuito de forma grafica cuando se habilite el
          arrastre.
        </p>
      </div>
      <div class="circuit" aria-label="Circuito de 2 qubits">
        <div class="wire-row" data-qubit="0">
          <div class="ket-label">|0&gt;</div>
          <div class="gate-track" aria-label="Fila de compuertas para qubit 1">
            <div class="gate-slot" data-dropzone="true" data-slot="1" data-qubit="0"></div>
            <div class="gate-slot" data-dropzone="true" data-slot="2" data-qubit="0"></div>
            <div class="gate-slot" data-dropzone="true" data-slot="3" data-qubit="0"></div>
            <div class="gate-slot" data-dropzone="true" data-slot="4" data-qubit="0"></div>
            <div class="gate-slot" data-dropzone="true" data-slot="5" data-qubit="0"></div>
            <div class="gate-slot" data-dropzone="true" data-slot="6" data-qubit="0"></div>
            <div class="gate-slot" data-dropzone="true" data-slot="7" data-qubit="0"></div>
            <div class="gate-slot" data-dropzone="true" data-slot="8" data-qubit="0"></div>
            <div class="gate-slot" data-dropzone="true" data-slot="9" data-qubit="0"></div>
            <div class="gate-slot" data-dropzone="true" data-slot="10" data-qubit="0"></div>
          </div>
        </div>
        <div class="wire-row" data-qubit="1">
          <div class="ket-label">|0&gt;</div>
          <div class="gate-track" aria-label="Fila de compuertas para qubit 2">
            <div class="gate-slot" data-dropzone="true" data-slot="1" data-qubit="1"></div>
            <div class="gate-slot" data-dropzone="true" data-slot="2" data-qubit="1"></div>
            <div class="gate-slot" data-dropzone="true" data-slot="3" data-qubit="1"></div>
            <div class="gate-slot" data-dropzone="true" data-slot="4" data-qubit="1"></div>
            <div class="gate-slot" data-dropzone="true" data-slot="5" data-qubit="1"></div>
            <div class="gate-slot" data-dropzone="true" data-slot="6" data-qubit="1"></div>
            <div class="gate-slot" data-dropzone="true" data-slot="7" data-qubit="1"></div>
            <div class="gate-slot" data-dropzone="true" data-slot="8" data-qubit="1"></div>
            <div class="gate-slot" data-dropzone="true" data-slot="9" data-qubit="1"></div>
            <div class="gate-slot" data-dropzone="true" data-slot="10" data-qubit="1"></div>
          </div>
        </div>
      </div>
      <a class="backlink" href="index.html">Volver a la pagina principal</a>
    </section>
  </main>
</body>
</html>
